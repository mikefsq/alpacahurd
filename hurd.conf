# hurd.conf — which device drivers get compiled into alpacahurd.
#
# One Go package import path per line. Comment a line out (#) to drop that
# driver from the build; add a third-party driver by appending its public
# module path. Then rebuild:
#
#   make            # regenerates drivers_gen.go from this file and builds
#
# To pin a driver to a specific version, run `go get <module>@<version>`
# after `make gen`.
#
# A driver package qualifies by registering itself with
# github.com/mikefsq/goalpaca/registry in init() — see DRIVERS.md.
#
# This list is platform-neutral: a platform-specific driver (smpro, asiair)
# constrains its own registration file (hurd_linux.go), so it stays listed
# here, compiles everywhere, and registers only where its hardware can exist.

# --- Telescopes (mounts) ---
github.com/mikefsq/goalpaca-devices/tenmicron
github.com/mikefsq/goalpaca-devices/asiam5
github.com/mikefsq/goalpaca-devices/onstep
github.com/mikefsq/goalpaca-devices/rst

# --- Cameras ---
github.com/mikefsq/goalpaca-devices/astrocam
github.com/mikefsq/goalpaca-devices/ptpcam

# --- Focusers ---
github.com/mikefsq/goalpaca-devices/asieaf
github.com/mikefsq/goalpaca-devices/oasisfoc
github.com/mikefsq/goalpaca-devices/focuscube
github.com/mikefsq/goalpaca-devices/focuslynx

# --- Filter wheels ---
github.com/mikefsq/goalpaca-devices/asiefw
github.com/mikefsq/goalpaca-devices/oasisfw

# --- Observing conditions ---
github.com/mikefsq/goalpaca-devices/mgpbox
github.com/mikefsq/goalpaca-devices/unihedron

# --- Simulators (no hardware; sim-telescope, sim-camera, sim-focuser, etc.) ---
# install verification and client development (config/hurd.sim.json).
github.com/mikefsq/goalpaca-devices/sim

# -- Switches --
github.com/mikefsq/goalpaca-devices/smpro
github.com/mikefsq/goalpaca-devices/asiair
