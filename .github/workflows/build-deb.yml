name: Debian Packages

# Release manually with:
#   gh workflow run build-deb.yml --repo mikefsq/alpacahurd -f version=1.2.3
# Then run publish.yml in mikefsq/apt to update the archive.
# Pull requests build and test packages without publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without a leading v, e.g. 1.2.3'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease. The apt archive resolves /releases/latest, which skips these.'
        required: false
        type: boolean
        default: false
  pull_request:

# Do not cancel release uploads midway through the architecture set.
concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deb:
    name: build
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # Version derivation requires tags and commit history.
        fetch-depth: 0

    - name: Select release source
      id: source
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [[ -n "$VERSION" ]]; then
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([~+.-][0-9A-Za-z.+~-]+)?$ ]] || {
            echo '::error::Use a version such as 1.2.3, without a leading v'
            exit 1
          }
          dpkg --validate-version "$VERSION"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            git checkout --detach "refs/tags/v$VERSION"
          fi
        fi
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Test and vet
      env:
        GOWORK: off
        GOFLAGS: -mod=readonly
      run: |
        go test ./...
        go vet ./...

    - name: Build packages
      env:
        VERSION: ${{ inputs.version }}
      run: |
        args=(-a 'amd64 arm64')
        if [[ -n "$VERSION" ]]; then args+=(-v "$VERSION"); fi
        build/build-deb "${args[@]}"

    - name: Upload packages
      uses: actions/upload-artifact@v6
      with:
        name: alpacahurd-deb
        path: dist/*.deb
        if-no-files-found: error

  install-test:
    name: install test (${{ matrix.arch }})
    needs: build-deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      DEB_ARCH: ${{ matrix.arch }}
    steps:
    - name: Download packages
      uses: actions/download-artifact@v8.0.1
      with:
        name: alpacahurd-deb
        path: dist

    - name: Install
      run: |
        test "$(dpkg --print-architecture)" = "$DEB_ARCH"
        sudo apt-get install -y ./dist/alpacahurd_*_"${DEB_ARCH}".deb

    - name: Check the service is running
      run: |
        systemctl is-enabled alpacahurd.service
        systemctl is-active alpacahurd.service

    - name: Verify the unit files
      # Keep validation informational: dependencies may trigger unrelated runner warnings.
      continue-on-error: true
      run: systemd-analyze verify alpacahurd.service alpacahurd-device@.service

    - name: Check the seeded configuration
      run: |
        test -f /etc/alpacahurd/hurd.json
        test -d /etc/alpacahurd/devices.d
        test -d /var/lib/alpacahurd/devices
        sudo alpacahurd -check -config /etc/alpacahurd/hurd.json

    - name: Check the orchestrator page answers
      run: |
        for i in $(seq 20); do
          curl -fsS -o /dev/null http://127.0.0.1:32227/setup && exit 0
          sleep 1
        done
        echo "the orchestrator page never answered on port 32227" >&2
        journalctl -u alpacahurd --no-pager -n 50
        exit 1

    - name: Check the simulated herd serves
      # Exercise device serving with the simulator configuration.
      run: |
        sudo cp /usr/share/doc/alpacahurd/examples/hurd.sim.json /etc/alpacahurd/hurd.json
        sudo systemctl restart alpacahurd.service
        for i in $(seq 20); do
          curl -fsS "http://127.0.0.1:11110/api/v1/telescope/0/name" && exit 0
          sleep 1
        done
        echo "the simulated telescope never answered on port 11110" >&2
        journalctl -u alpacahurd --no-pager -n 50
        exit 1

    - name: Purge
      run: |
        sudo apt-get purge -y alpacahurd
        test ! -e /usr/bin/alpacahurd
        test ! -e /etc/alpacahurd
        test ! -e /var/lib/alpacahurd
        test ! -e /lib/systemd/system/alpacahurd.service

  release:
    name: release
    needs: [build-deb, install-test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-deb.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: alpacahurd-deb
          path: dist
      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ needs.build-deb.outputs.source_sha }}
        run: |
          # Resolve annotated and lightweight tags to their commit on GitHub.
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tagged_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            if [[ "$tagged_sha" != "$SOURCE_SHA" ]]; then
              echo "::error::$TAG does not point to the tested commit $SOURCE_SHA"
              exit 1
            fi
          fi
          # A manual rerun may find an already-published release. Keep existing
          # assets immutable; only upload any missing architecture packages.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft > release.json 2>/dev/null; then
            jq -e '.isDraft == false' release.json >/dev/null || {
              echo "::error::$TAG is a draft; finish or remove the draft first"
              exit 1
            }
            for arch in amd64 arm64; do
              asset="alpacahurd_${TAG#v}_${arch}.deb"
              test -s "dist/$asset"
              if ! jq -e --arg name "$asset" '.assets[] | select(.name == $name and .size > 0)' release.json >/dev/null; then
                gh release upload "$TAG" "dist/$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
            echo "$TAG is published with amd64 and arm64 packages; existing assets preserved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=()
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            args+=(--verify-tag)
          else
            args+=(--target "$SOURCE_SHA")
          fi
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --generate-notes "${args[@]}"
          echo "Released $TAG with amd64 and arm64 packages. APT archive publication is a separate step." >> "$GITHUB_STEP_SUMMARY"
