name: Debian Packages

# Release manually with:
#   gh workflow run build-deb.yml --repo mikefsq/alpacahurd -f version=1.2.3
# Then run publish.yml in mikefsq/apt to update the archive.
# Pull requests build and test packages without publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without a leading v, e.g. 1.2.3'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease. The apt archive resolves /releases/latest, which skips these.'
        required: false
        type: boolean
        default: false
  pull_request:

# Do not cancel release uploads midway through the architecture set.
concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deb:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # Version derivation requires tags and commit history.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Test and vet
      env:
        GOWORK: off
        GOFLAGS: -mod=readonly
      run: |
        go test ./...
        go vet ./...

    - name: Build packages
      run: build/build-deb ${{ inputs.version && format('-v {0}', inputs.version) || '' }}

    - name: Upload packages
      uses: actions/upload-artifact@v6
      with:
        name: alpacahurd-deb
        path: dist/*.deb
        if-no-files-found: error

  install-test:
    name: install test
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
    - name: Download packages
      uses: actions/download-artifact@v6
      with:
        name: alpacahurd-deb
        path: dist

    - name: Install
      run: sudo apt-get install -y ./dist/alpacahurd_*_amd64.deb

    - name: Check the service is running
      run: |
        systemctl is-enabled alpacahurd.service
        systemctl is-active alpacahurd.service

    - name: Verify the unit files
      # Keep validation informational: dependencies may trigger unrelated runner warnings.
      continue-on-error: true
      run: systemd-analyze verify alpacahurd.service alpacahurd-device@.service

    - name: Check the seeded configuration
      run: |
        test -f /etc/alpacahurd/hurd.json
        test -d /etc/alpacahurd/devices.d
        test -d /var/lib/alpacahurd/devices
        sudo alpacahurd -check -config /etc/alpacahurd/hurd.json

    - name: Check the orchestrator page answers
      run: |
        for i in $(seq 20); do
          curl -fsS -o /dev/null http://127.0.0.1:32227/setup && exit 0
          sleep 1
        done
        echo "the orchestrator page never answered on port 32227" >&2
        journalctl -u alpacahurd --no-pager -n 50
        exit 1

    - name: Check the simulated herd serves
      # Exercise device serving with the simulator configuration.
      run: |
        sudo cp /usr/share/doc/alpacahurd/examples/hurd.sim.json /etc/alpacahurd/hurd.json
        sudo systemctl restart alpacahurd.service
        for i in $(seq 20); do
          curl -fsS "http://127.0.0.1:11110/api/v1/telescope/0/name" && exit 0
          sleep 1
        done
        echo "the simulated telescope never answered on port 11110" >&2
        journalctl -u alpacahurd --no-pager -n 50
        exit 1

    - name: Purge
      run: |
        sudo apt-get purge -y alpacahurd
        test ! -e /usr/bin/alpacahurd
        test ! -e /etc/alpacahurd
        test ! -e /var/lib/alpacahurd
        test ! -e /lib/systemd/system/alpacahurd.service

  release:
    name: release
    needs: [build-deb, install-test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download packages
      uses: actions/download-artifact@v6
      with:
        name: alpacahurd-deb
        path: dist

    - name: Create the release and attach the packages
      # Create a new release and tag; never replace assets already published to apt.
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: v${{ inputs.version }}
      run: |
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "::error::$TAG already exists — release a new version rather than replacing it"
          exit 1
        fi
        gh release create "$TAG" dist/*.deb \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$TAG" \
          --generate-notes \
          ${{ inputs.prerelease && '--prerelease' || '' }}
        echo "Released $TAG. Run 'Publish archive' in mikefsq/apt to reach the fleet." >> "$GITHUB_STEP_SUMMARY"
